<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HelloET Logo Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      padding: 40px 32px;
      min-height: 100vh;
    }
    header {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 40px;
      padding-bottom: 16px;
      border-bottom: 1px solid #e2e8f0;
    }
    .grid {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 900px;
    }
    .card {
      background: white;
      border-radius: 24px;
      padding: 44px 48px;
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .card.dark {
      background: #0f172a;
      border-color: #1e293b;
    }
    .label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #cbd5e1;
    }
    .card.dark .label { color: #334155; }
    .logo-wrap img { display: block; }

    .icon-row {
      display: flex;
      gap: 28px;
      align-items: flex-end;
      flex-wrap: wrap;
    }
    .icon-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .size-label {
      font-size: 10px;
      color: #94a3b8;
      font-weight: 600;
      letter-spacing: 1px;
    }

    /* Isometric display for icon */
    .iso-wrap {
      display: flex;
      align-items: center;
      gap: 32px;
    }
    .iso-wrap img {
      filter: drop-shadow(0 16px 32px rgba(22,163,74,0.3));
    }
  </style>
</head>
<body>
  <header>HelloET — 3D Logo System · H + Location Pin</header>

  <div class="grid">

    <!-- Light -->
    <div class="card">
      <span class="label">Primary Logo · Light Background</span>
      <div class="logo-wrap">
        <img src="logo.svg" alt="HelloET Logo" style="height:90px; width:auto;">
      </div>
    </div>

    <!-- Dark -->
    <div class="card dark">
      <span class="label">Primary Logo · Dark Background</span>
      <div class="logo-wrap">
        <img src="logo-dark.svg" alt="HelloET Dark Logo" style="height:90px; width:auto;">
      </div>
    </div>

    <!-- Icon sizes -->
    <div class="card">
      <span class="label">3D Icon Mark · All Sizes</span>
      <div class="icon-row">
        <div class="icon-item">
          <img src="logo-icon.svg" alt="HelloET Icon" style="height:100px; width:100px; filter:drop-shadow(0 12px 24px rgba(22,163,74,0.35))">
          <span class="size-label">100px</span>
        </div>
        <div class="icon-item">
          <img src="logo-icon.svg" alt="HelloET Icon" style="height:72px; width:72px; filter:drop-shadow(0 8px 16px rgba(22,163,74,0.3))">
          <span class="size-label">72px</span>
        </div>
        <div class="icon-item">
          <img src="logo-icon.svg" alt="HelloET Icon" style="height:48px; width:48px; filter:drop-shadow(0 6px 12px rgba(22,163,74,0.25))">
          <span class="size-label">48px</span>
        </div>
        <div class="icon-item">
          <img src="logo-icon.svg" alt="HelloET Icon" style="height:32px; width:32px;">
          <span class="size-label">32px</span>
        </div>
        <div class="icon-item">
          <img src="logo-icon.svg" alt="HelloET Icon" style="height:20px; width:20px;">
          <span class="size-label">20px</span>
        </div>
      </div>
    </div>

    <!-- Icon on dark -->
    <div class="card dark">
      <span class="label">3D Icon Mark · Dark Background</span>
      <div class="iso-wrap">
        <img src="logo-icon.svg" alt="HelloET Icon" style="height:100px; width:100px; filter:drop-shadow(0 16px 32px rgba(74,222,128,0.4))">
        <img src="logo-icon.svg" alt="HelloET Icon" style="height:72px; width:72px; filter:drop-shadow(0 12px 24px rgba(74,222,128,0.35))">
        <img src="logo-icon.svg" alt="HelloET Icon" style="height:48px; width:48px;">
      </div>
    </div>

  </div>
</body>
</html>
