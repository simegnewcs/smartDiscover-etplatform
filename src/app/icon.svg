<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 124 150" width="124" height="150" fill="none">
  <defs>

    <!-- ── PIN GRADIENTS ── -->
    <linearGradient id="pinBody" x1="25%" y1="0%" x2="75%" y2="100%">
      <stop offset="0%"   stop-color="#5ae08a"/>
      <stop offset="35%"  stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#0a4020"/>
    </linearGradient>

    <!-- Scallop bubbles same gradient -->
    <linearGradient id="scalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <!-- Gloss reflection (top-left) -->
    <radialGradient id="gloss" cx="34%" cy="20%" r="48%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="55%"  stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- H front face bevel (lit from top-left) -->
    <linearGradient id="hFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="60%"  stop-color="#f4f9f6"/>
      <stop offset="100%" stop-color="#dceae0"/>
    </linearGradient>

    <!-- H top extrusion face (lit from top, slight green tint) -->
    <linearGradient id="hTopF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#e8f8f0"/>
      <stop offset="100%" stop-color="#bcd5c8"/>
    </linearGradient>

    <!-- H right extrusion face (shadow side) -->
    <linearGradient id="hRightF" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#aac8ba"/>
      <stop offset="100%" stop-color="#86a898"/>
    </linearGradient>

    <!-- Cast shadow beneath pin -->
    <radialGradient id="castSh" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

  </defs>

  <!-- ══════════════════════════════════════ -->
  <!--          CAST SHADOW                  -->
  <!-- ══════════════════════════════════════ -->
  <ellipse cx="62" cy="145" rx="26" ry="6" fill="url(#castSh)"/>

  <!-- ══════════════════════════════════════ -->
  <!--    SCALLOPED TOP BUMPS               -->
  <!--  Circles at r=48 from pin centre,    -->
  <!--  angles -55° to +55° (every 18.3°)  -->
  <!--  Pin centre = (62, 64)               -->
  <!-- ══════════════════════════════════════ -->
  <!-- θ=-55°: cx=62+48*sin(-55°)=62-39.3=22.7, cy=64-48*cos(-55°)=64-27.5=36.5 -->
  <!-- θ=-36.7°: cx=62+48*sin(-36.7°)=62-28.7=33.3, cy=64-48*cos(-36.7°)=64-38.5=25.5 -->
  <!-- θ=-18.3°: cx=62+48*sin(-18.3°)=62-15.1=46.9, cy=64-48*cos(-18.3°)=64-45.6=18.4 -->
  <!-- θ=0°: cx=62, cy=64-48=16 -->
  <!-- θ=18.3°: cx=77.1, cy=18.4 -->
  <!-- θ=36.7°: cx=90.7, cy=25.5 -->
  <!-- θ=55°: cx=101.3, cy=36.5 -->
  <circle cx="22.7" cy="36.5" r="8" fill="url(#scalGrad)"/>
  <circle cx="33.3" cy="25.5" r="8" fill="url(#scalGrad)"/>
  <circle cx="46.9" cy="18.4" r="8" fill="url(#scalGrad)"/>
  <circle cx="62"   cy="16"   r="8" fill="url(#scalGrad)"/>
  <circle cx="77.1" cy="18.4" r="8" fill="url(#scalGrad)"/>
  <circle cx="90.7" cy="25.5" r="8" fill="url(#scalGrad)"/>
  <circle cx="101.3" cy="36.5" r="8" fill="url(#scalGrad)"/>

  <!-- ══════════════════════════════════════ -->
  <!--  MAIN PIN BODY                        -->
  <!--  Centre (62,64), r=48, tip at y=128  -->
  <!-- ══════════════════════════════════════ -->
  <path d="
    M62 16
    C37 16 14 39 14 64
    C14 89 38 112 56 126
    C58 127.5 66 127.5 68 126
    C86 112 110 89 110 64
    C110 39 87 16 62 16 Z
  " fill="url(#pinBody)"/>

  <!-- ══════════════════════════════════════ -->
  <!--  ETHIOPIAN FLAG RIBBON                -->
  <!--  Ring sectors: center(62,64)          -->
  <!--  Angles θ from -68° to +22°           -->
  <!--  (sweeping from upper-left to right)  -->
  <!-- ══════════════════════════════════════ -->

  <!-- GREEN outer band r=50–60 (extends past pin edge r=48) -->
  <!-- θ=-68°: (62+50·sin(-68°), 64-50·cos(-68°)) = (62-46.4, 64-18.7) = (15.6, 45.3) -->
  <!-- θ=22°: (62+50·sin(22°), 64-50·cos(22°)) = (62+18.7, 64-46.4) = (80.7, 17.6) -->
  <!-- θ=22°,r=60: (62+60·sin(22°), 64-60·cos(22°)) = (62+22.5, 64-55.6) = (84.5, 8.4) -->
  <!-- θ=-68°,r=60: (62+60·sin(-68°), 64-60·cos(-68°)) = (62-55.6, 64-22.5) = (6.4, 41.5) -->
  <path d="M15.6 45.3 A50 50 0 0 1 80.7 17.6 L84.5 8.4 A60 60 0 0 0 6.4 41.5 Z"
        fill="#078930" opacity="0.88"/>

  <!-- YELLOW middle band r=40–50 -->
  <!-- θ=-68°,r=40: (62-37.1, 64-15) = (24.9, 49) -->
  <!-- θ=22°,r=40: (62+15, 64-37.1) = (77, 26.9) -->
  <path d="M24.9 49 A40 40 0 0 1 77 26.9 L80.7 17.6 A50 50 0 0 0 15.6 45.3 Z"
        fill="#FCDD09"/>

  <!-- RED inner band r=31–40 -->
  <!-- θ=-68°,r=31: (62-28.8, 64-11.6) = (33.2, 52.4) -->
  <!-- θ=22°,r=31: (62+11.6, 64-28.8) = (73.6, 35.2) -->
  <path d="M33.2 52.4 A31 31 0 0 1 73.6 35.2 L77 26.9 A40 40 0 0 0 24.9 49 Z"
        fill="#DA121A"/>

  <!-- ══════════════════════════════════════ -->
  <!--  GLOSS OVERLAY (main 3D cue on pin)  -->
  <!-- ══════════════════════════════════════ -->
  <path d="
    M62 16
    C37 16 14 39 14 64
    C14 89 38 112 56 126
    C58 127.5 66 127.5 68 126
    C86 112 110 89 110 64
    C110 39 87 16 62 16 Z
  " fill="url(#gloss)"/>

  <!-- ══════════════════════════════════════ -->
  <!--   3D EXTRUDED H LETTER               -->
  <!--  Left bar:  x=34–47,  y=22–82       -->
  <!--  Right bar: x=77–90,  y=22–82       -->
  <!--  Crossbar:  x=34–90,  y=46–56       -->
  <!--  Extrusion: right +4, up -4          -->
  <!--  (light from top-left)               -->
  <!-- ══════════════════════════════════════ -->

  <!-- ── STEP 1: Shadow offset rects (drawn behind) ── -->
  <rect x="38" y="26" width="13" height="60" rx="2.5" fill="#042a12" opacity="0.32"/>
  <rect x="81" y="26" width="13" height="60" rx="2.5" fill="#042a12" opacity="0.32"/>
  <rect x="51" y="50" width="26" height="10" rx="2"   fill="#042a12" opacity="0.28"/>

  <!-- ── STEP 2: Top extrusion faces (lit, slightly green) ── -->
  <polygon points="34,22  47,22  51,18  38,18" fill="url(#hTopF)"/>
  <polygon points="77,22  90,22  94,18  81,18" fill="url(#hTopF)"/>
  <polygon points="34,46  77,46  81,42  38,42" fill="url(#hTopF)"/>

  <!-- ── STEP 3: Right extrusion faces (shadow side) ── -->
  <polygon points="47,22  51,18  51,86  47,82" fill="url(#hRightF)"/>
  <polygon points="90,22  94,18  94,86  90,82" fill="url(#hRightF)"/>
  <polygon points="77,46  81,42  81,60  77,56" fill="url(#hRightF)"/>

  <!-- ── STEP 4: Bottom extrusion faces (darkest) ── -->
  <polygon points="34,82  47,82  51,86  38,86" fill="#7a9888" opacity="0.72"/>
  <polygon points="77,82  90,82  94,86  81,86" fill="#7a9888" opacity="0.72"/>
  <polygon points="34,56  77,56  81,60  38,60" fill="#7a9888" opacity="0.62"/>

  <!-- ── STEP 5: Front faces (white with bevel gradient) ── -->
  <rect x="34" y="22" width="13" height="60" rx="2.5" fill="url(#hFront)"/>
  <rect x="77" y="22" width="13" height="60" rx="2.5" fill="url(#hFront)"/>
  <rect x="34" y="46" width="43" height="10" rx="2"   fill="url(#hFront)"/>

  <!-- ── STEP 6: Bevel edge highlights ── -->
  <!-- Left/top bright edges (catch the light) -->
  <rect x="34" y="22" width="2.5" height="60" rx="1" fill="white" opacity="0.88"/>
  <rect x="77" y="22" width="2.5" height="60" rx="1" fill="white" opacity="0.88"/>
  <rect x="34" y="22" width="13"  height="2.5" rx="1" fill="white" opacity="0.88"/>
  <rect x="77" y="22" width="13"  height="2.5" rx="1" fill="white" opacity="0.88"/>
  <rect x="34" y="46" width="43"  height="2.5" rx="1" fill="white" opacity="0.88"/>

  <!-- Right/bottom dark edges (shadow side) -->
  <rect x="45" y="24" width="2" height="56" rx="1" fill="#0a3d22" opacity="0.14"/>
  <rect x="88" y="24" width="2" height="56" rx="1" fill="#0a3d22" opacity="0.14"/>
  <rect x="34" y="79" width="13" height="3"  rx="1" fill="#0a3d22" opacity="0.12"/>
  <rect x="77" y="79" width="13" height="3"  rx="1" fill="#0a3d22" opacity="0.12"/>
  <rect x="34" y="53" width="43" height="3"  rx="1" fill="#0a3d22" opacity="0.1"/>

  <!-- ══════════════════════════════════════ -->
  <!--   STORE ICON in upper H gap          -->
  <!--   Gap area: x=47–77, y=22–46        -->
  <!--   Icon centered at (62, 34)          -->
  <!-- ══════════════════════════════════════ -->

  <!-- Main awning triangle -->
  <polygon points="47,44 77,44 62,26" fill="white" opacity="0.9"/>

  <!-- Awning vertical folds (darker lines give tent/canopy look) -->
  <line x1="54" y1="34.5" x2="50" y2="44" stroke="#0d5c2e" stroke-width="1.2" opacity="0.3"/>
  <line x1="62" y1="26"   x2="58" y2="44" stroke="#0d5c2e" stroke-width="1.2" opacity="0.3"/>
  <line x1="62" y1="26"   x2="66" y2="44" stroke="#0d5c2e" stroke-width="1.2" opacity="0.3"/>
  <line x1="70" y1="34.5" x2="74" y2="44" stroke="#0d5c2e" stroke-width="1.2" opacity="0.3"/>

  <!-- Small store front band at base of awning (above crossbar) -->
  <rect x="52" y="44" width="20" height="4" rx="1" fill="white" opacity="0.78"/>
  <!-- Door opening -->
  <rect x="58" y="44" width="8" height="4" rx="1" fill="#16a34a" opacity="0.5"/>

  <!-- ══════════════════════════════════════ -->
  <!--  PIN TIP REFLECTION (soft glow)      -->
  <!-- ══════════════════════════════════════ -->
  <ellipse cx="62" cy="129" rx="11" ry="4.5" fill="#4ade80" opacity="0.22"/>

</svg>
